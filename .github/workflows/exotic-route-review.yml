name: exotic-route-review

on:
  push:
    paths:
      - "tools/bakeoff/exotic_routes.py"
      - ".github/workflows/exotic-route-review.yml"
      - "tools/native/pokered_native.py"
      - "config/pokered-source.toml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infinite Red
        uses: actions/checkout@v4

      - name: Checkout pinned pokered
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(python - <<'PY'
          import tomllib
          with open("config/pokered-source.toml", "rb") as f:
              print(tomllib.load(f)["commit"])
          PY
          )"
          git clone --filter=blob:none --no-checkout https://github.com/pret/pokered.git "$RUNNER_TEMP/pokered"
          git -C "$RUNNER_TEMP/pokered" fetch --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/pokered" checkout --detach "$PIN"

      - name: Install rendering dependencies
        run: python -m pip install -r tools/native/requirements.txt

      - name: Generate exotic review suite
        env:
          PYTHONPATH: tools/native
        run: |
          python tools/bakeoff/exotic_routes.py             --repo "$RUNNER_TEMP/pokered"             --output "$RUNNER_TEMP/exotic-routes"
          cat "$RUNNER_TEMP/exotic-routes/results.json"

      - name: Upload review suite
        uses: actions/upload-artifact@v4
        with:
          name: exotic-route-review
          path: ${{ runner.temp }}/exotic-routes/
          if-no-files-found: error
