name: native-pokered-roundtrip

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pallet-roundtrip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Infinite Red
        uses: actions/checkout@v4

      - name: Checkout pinned pokered
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(python - <<'PY'
          import tomllib
          with open("config/pokered-source.toml", "rb") as f:
              print(tomllib.load(f)["commit"])
          PY
          )"
          git clone --filter=blob:none --no-checkout https://github.com/pret/pokered.git "$RUNNER_TEMP/pokered"
          git -C "$RUNNER_TEMP/pokered" fetch --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/pokered" checkout --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/pokered" rev-parse HEAD)" = "$PIN"

      - name: Install native adapter requirements
        run: python -m pip install -r tools/native/requirements.txt

      - name: Syntax check native adapter
        run: python -m py_compile tools/native/pokered_native.py tools/native/test_pokered_native.py

      - name: Run native parser tests
        env:
          POKERED_REPO: ${{ runner.temp }}/pokered
          PYTHONPATH: tools/native
        run: python -m unittest tools/native/test_pokered_native.py -v

      - name: Verify and render Pallet Town
        run: |
          python tools/native/pokered_native.py verify-pallet \
            --repo "$RUNNER_TEMP/pokered" \
            --output "$RUNNER_TEMP/native-pallet" \
            --scale 3

      - name: Assert exact block round-trip
        run: cmp "$RUNNER_TEMP/pokered/maps/PalletTown.blk" "$RUNNER_TEMP/native-pallet/PalletTown.blk"

      - name: Generate first post-Pallet geography
        run: |
          python tools/native/pokered_native.py generate-first-geography \
            --repo "$RUNNER_TEMP/pokered" \
            --output "$RUNNER_TEMP/first-geography" \
            --seed 42
          test -s "$RUNNER_TEMP/first-geography/patch/maps/Route1.blk"
          test -s "$RUNNER_TEMP/first-geography/FirstRoute.generated.png"
          test -s "$RUNNER_TEMP/first-geography/FirstGeography.generated.json"
          ! cmp -s "$RUNNER_TEMP/pokered/maps/Route1.blk" "$RUNNER_TEMP/first-geography/patch/maps/Route1.blk"
          ! grep -q 'ROUTE 1' "$RUNNER_TEMP/first-geography/patch/text/Route1.asm"
          ! grep -q 'VIRIDIAN CITY' "$RUNNER_TEMP/first-geography/patch/text/Route1.asm"

      - name: Install pinned RGBDS
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/gbdev/rgbds/releases/download/v1.0.3/rgbds-linux-x86_64.tar.xz"
          ARCHIVE="$RUNNER_TEMP/rgbds.tar.xz"
          curl -L --fail --retry 3 "$URL" -o "$ARCHIVE"
          echo "280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rgbds"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/rgbds"
          RGBASM="$(find "$RUNNER_TEMP/rgbds" -type f -name rgbasm -perm -u+x | head -n 1)"
          test -n "$RGBASM"
          RGBDS_DIR="$(dirname "$RGBASM")"
          echo "RGBDS_DIR=$RGBDS_DIR" >> "$GITHUB_ENV"
          "$RGBASM" --version | tee "$RUNNER_TEMP/rgbds-version.txt"
          grep -q "1.0.3" "$RUNNER_TEMP/rgbds-version.txt"

      - name: Build pokered with generated geography
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/first-geography/patch/." "$RUNNER_TEMP/pokered/"
          make -C "$RUNNER_TEMP/pokered" RGBDS="$RGBDS_DIR/" pokered.gbc
          test -s "$RUNNER_TEMP/pokered/pokered.gbc"
          test -s "$RUNNER_TEMP/pokered/pokered.map"
          sha256sum "$RUNNER_TEMP/pokered/pokered.gbc"
          echo "stock-engine build accepted generated geography + names"

      - name: Preserve linker map, not ROM
        run: cp "$RUNNER_TEMP/pokered/pokered.map" "$RUNNER_TEMP/first-geography/pokered.generated.map"

      - name: Upload native proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-map-proofs
          path: |
            ${{ runner.temp }}/native-pallet/
            ${{ runner.temp }}/first-geography/
          if-no-files-found: error
